<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="lobby" class="screen">
    <h1>♠ Batak <button id="soundToggleBtn" class="icon-btn" title="Sesi aç/kapat">🔊</button></h1>
    <label>Adınız</label>
    <input id="nameInput" type="text" maxlength="20" placeholder="İsminiz" />

    <div class="lobby-actions">
      <div class="card">
        <h2>Yeni Masa Kur</h2>
        <input id="tableNameInput" type="text" maxlength="24" placeholder="Masa adı (opsiyonel)" />

        <div class="mode-toggles">
          <label class="toggle">
            <input id="modePartnership" type="checkbox" />
            <span><strong>Eşli</strong> — 2v2 takım (0-2 ve 1-3 koltukları)</span>
          </label>
          <label class="toggle sub">
            <input id="modeOpenHand" type="checkbox" disabled />
            <span><strong>Açık</strong> — ihale biten anda ortağın eli herkese açılır</span>
          </label>
          <label class="toggle">
            <input id="modeMaca" type="checkbox" />
            <span><strong>Maça</strong> — koz her zaman ♠, kozsuz/gizli/elsiz kapalı</span>
          </label>
          <label class="toggle">
            <input id="modeStrictTrump" type="checkbox" checked />
            <span><strong>Zorunlu Kesme/Basma</strong> — renk yoksa koz zorunlu, üstüne basabiliyorsan basmak zorunlu</span>
          </label>
          <label class="toggle">
            <input id="modeBuried" type="checkbox" />
            <span><strong>Gömmeli</strong> — 4 kart kenara ayrılır, ihaleyi alan bunu görüp elinden 4 kart gömer</span>
          </label>
          <label class="toggle">
            <input id="modeSpectators" type="checkbox" checked />
            <span><strong>Seyirciye Açık</strong> — masa dolunca gelenler izleyebilir</span>
          </label>
        </div>

        <details class="rules-details">
          <summary>Puanlama ve bitiş ayarları</summary>
          <div class="rules-grid">
            <label>Puanlama
              <select id="ruleScoringMode">
                <option value="takenTricks">Alınan el kadar</option>
                <option value="bidOnly">Sadece ihale kadar</option>
                <option value="bidPlusOvertricks">İhale + fazla el</option>
              </select>
            </label>
            <label>Batak cezası
              <select id="rulePenaltyMode">
                <option value="negativeBid">İhale kadar eksi</option>
                <option value="negativeTaken">Eksik el kadar</option>
                <option value="fixedPenalty">Sabit ceza</option>
              </select>
            </label>
            <label>Minimum ihale
              <input id="ruleMinBid" type="number" min="1" max="13" value="5" />
            </label>
            <label>Oyun bitişi
              <select id="ruleGameEndMode">
                <option value="targetScore">Hedef skora ulaşınca</option>
                <option value="fixedHands">Sabit el sayısında</option>
              </select>
            </label>
            <label>Hedef skor
              <input id="ruleTargetScore" type="number" min="20" max="2000" value="101" />
            </label>
            <label>El sayısı (sabit modda)
              <input id="ruleHandsPerMatch" type="number" min="1" max="100" value="8" />
            </label>
          </div>
        </details>

        <button id="createTableBtn">Masa Kur</button>
      </div>
      <div class="card">
        <h2>Masaya Katıl</h2>
        <input id="joinCodeInput" type="text" maxlength="6" placeholder="Masa Kodu" style="text-transform:uppercase" />
        <button id="joinTableBtn">Katıl</button>
        <p class="hint">Masa doluysa otomatik olarak seyirci olarsun.</p>
      </div>
    </div>

    <div class="card wide">
      <h2>Açık Masalar <button id="refreshLobbyBtn">↻</button></h2>
      <ul id="openTables"></ul>
    </div>
  </section>

  <section id="waiting" class="screen hidden">
    <h1>Masa: <span id="waitTableId"></span></h1>
    <div id="waitModeBadges" class="badges"></div>
    <p>Bu kodu arkadaşlarınla paylaş, üyelik gerekmiyor.</p>
    <ul id="seatList" class="seat-list"></ul>
    <div class="row">
      <button id="addBotBtn" class="hidden">🤖 Bot Ekle</button>
      <button id="startGameBtn" class="hidden">Oyunu Başlat</button>
      <button id="leaveWaitingBtn" class="btn-leave">Masadan Ayrıl</button>
    </div>
    <p id="spectatorNote" class="hint hidden"></p>
  </section>

  <section id="game" class="screen hidden">
    <header id="scoreboard-wrap">
      <div id="modeBadges" class="badges"></div>
      <div id="scoreboard"></div>
      <button id="leaveGameBtn" class="btn-leave">Oyundan Çık</button>
    </header>

    <div id="table-felt">
      <div id="seat-top" class="seat-pos"></div>
      <div id="seat-left" class="seat-pos"></div>
      <div id="seat-right" class="seat-pos"></div>
      <div id="seat-bottom" class="seat-pos"></div>
      <div id="trick-center">
        <div class="trick-slot" data-pos="top"></div>
        <div class="trick-slot" data-pos="left"></div>
        <div class="trick-slot" data-pos="right"></div>
        <div class="trick-slot" data-pos="bottom"></div>
        <div id="status-line"></div>
        <div id="turn-timer" class="hidden"></div>
      </div>
    </div>

    <div id="open-hand-panel" class="panel hidden"></div>
    <div id="exchange-panel" class="panel hidden"></div>
    <div id="bid-panel" class="panel hidden"></div>
    <div id="trump-panel" class="panel hidden"></div>
    <div id="hand-complete-panel" class="panel hidden"></div>
    <div id="match-complete-panel" class="panel hidden"></div>

    <div id="hand"></div>

    <div id="chat-panel" class="panel">
      <h3>Sohbet</h3>
      <div id="chatLog"></div>
      <div class="row">
        <input id="chatInput" type="text" maxlength="300" placeholder="Mesaj yaz..." />
        <button id="chatSendBtn">Gönder</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
